spring.application.name=mytutor-ai

server.port=${PORT:8081}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.frontend-url=${FRONTEND_URL:http://localhost:4200}

# AI: ollama | gemini | rule
app.ai.provider=${AI_PROVIDER:rule}

app.ai.ollama-url=${OLLAMA_URL:http://localhost:11434/api/chat}
app.ai.ollama-model=${OLLAMA_MODEL:llama3.2:3b}

app.ai.gemini-api-key=${GEMINI_API_KEY:}
app.ai.gemini-model=${GEMINI_MODEL:gemini-3.6-flash}

app.knowledge.base-dir=${KNOWLEDGE_BASE_DIR:./knowledge}
